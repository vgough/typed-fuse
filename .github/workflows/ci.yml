name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libfuse3-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --examples --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Test mounted path listings
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          cargo test -p typed-fuse --test live_path_listing -- --ignored --nocapture

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          usesh: true
          copyback: false
          prepare: pkg install -y fusefs-libs3 llvm pkgconf rust
          run: |
            kldstat -q -m fusefs || kldload fusefs
            cargo build --workspace --examples --verbose
            cargo test --workspace --verbose
            cargo test -p typed-fuse --test live_path_listing -- --ignored --nocapture
